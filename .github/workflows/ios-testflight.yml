name: iOS TestFlight

# Signerer og uploader appen til TestFlight — uden Mac.
# Bruger cloud-signering via App Store Connect API-nøgle, så ingen certifikater
# skal vedligeholdes manuelt.
#
# Kræver disse GitHub Secrets (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      – Key ID for App Store Connect API-nøglen
#   ASC_ISSUER_ID   – Issuer ID
#   ASC_KEY_P8      – hele indholdet af .p8-filen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Signér og upload til TestFlight
    runs-on: macos-15
    env:
      KEY_PATH: ${{ github.workspace }}/AuthKey.p8
    steps:
      - uses: actions/checkout@v4

      - name: Vælg nyeste Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Installér XcodeGen
        run: brew install xcodegen

      - name: Generér Xcode-projekt
        working-directory: ios
        run: xcodegen generate

      - name: Skriv API-nøgle
        run: |
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

      - name: Skriv ExportOptions.plist
        working-directory: ios
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>9VMB4XZSKS</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

      - name: Arkivér (signeret)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Mindebog.xcodeproj \
            -scheme Mindebog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mindebog.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            DEVELOPMENT_TEAM="9VMB4XZSKS" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Eksportér og upload til TestFlight
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Mindebog.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      - name: Ryd op
        if: always()
        run: rm -f "$KEY_PATH"
