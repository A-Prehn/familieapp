name: iOS TestFlight

# Signerer og uploader appen til TestFlight — uden Mac.
#
# Metode: manuelt distributionscertifikat (.p12, oprettet én gang) + App Store-
# provisioning-profil hentet med fastlane via App Store Connect API-nøglen.
# Upload sker med altool via samme API-nøgle. Xcodes cloud-signering bruges
# IKKE (den afviser API-nøglen fra GitHub-runnere).
#
# GitHub Secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   – App Store Connect API-nøgle
#   DIST_CERT_P12_BASE64                    – Apple Distribution-certifikat (.p12, base64)
#   DIST_CERT_PASSWORD                      – adgangskode til .p12

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-testflight.yml"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Signér og upload til TestFlight
    runs-on: macos-15
    env:
      TEAM_ID: 9VMB4XZSKS
      BUNDLE_ID: net.prehn.mindebog
      KEY_DIR: /Users/runner/.appstoreconnect/private_keys
      KEY_PATH: /Users/runner/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      KEYCHAIN_PATH: /Users/runner/ci.keychain-db
      KEYCHAIN_PASSWORD: ci-temp-password
    steps:
      - uses: actions/checkout@v4

      - name: Vælg nyeste Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Installér XcodeGen
        run: brew install xcodegen

      - name: Generér Xcode-projekt
        working-directory: ios
        run: xcodegen generate

      - name: Skriv API-nøgle
        run: |
          mkdir -p "$KEY_DIR"
          printf '%s\n' "${{ secrets.ASC_KEY_P8 }}" | tr -d '\r' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout -check && echo "API-nøgle OK"

      - name: Importér distributionscertifikat i midlertidig keychain
        run: |
          echo "${{ secrets.DIST_CERT_P12_BASE64 }}" | base64 --decode > /tmp/dist.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import /tmp/dist.p12 -P "${{ secrets.DIST_CERT_PASSWORD }}" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f /tmp/dist.p12
          echo "Identiteter i keychain:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Hent App Store-provisioning-profil (fastlane sigh via API-nøgle)
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
        run: |
          # sigh på kommandolinjen læser nøglen fra en JSON-fil (ikke fra env).
          jq -n \
            --arg k "${{ secrets.ASC_KEY_ID }}" \
            --arg i "${{ secrets.ASC_ISSUER_ID }}" \
            --rawfile p "$KEY_PATH" \
            '{key_id: $k, issuer_id: $i, key: $p, in_house: false}' > /tmp/asc_key.json
          mkdir -p ios/profiles
          fastlane sigh \
            --api_key_path /tmp/asc_key.json \
            --app_identifier "$BUNDLE_ID" \
            --team_id "$TEAM_ID" \
            --output_path ios/profiles \
            --filename Mindebog_AppStore.mobileprovision \
            --skip_install false \
            --force
          rm -f /tmp/asc_key.json
          # Push (CloudKit-notifikationer) kræver aps-environment i profilen.
          if ! security cms -D -i ios/profiles/Mindebog_AppStore.mobileprovision | grep -q "aps-environment"; then
            echo "::error::Profilen mangler Push Notifications. Slå 'Push Notifications' til på App ID'et net.prehn.mindebog i developer.apple.com."
            exit 1
          fi
          echo "PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i ios/profiles/Mindebog_AppStore.mobileprovision)")" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i ios/profiles/Mindebog_AppStore.mobileprovision)")" >> "$GITHUB_ENV"

      - name: Arkivér (manuel signering)
        working-directory: ios
        run: |
          set -o pipefail
          echo "Profil: $PROFILE_NAME ($PROFILE_UUID)"
          xcodebuild archive \
            -project Mindebog.xcodeproj \
            -scheme Mindebog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Mindebog.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Eksportér IPA (manuel signering)
        working-directory: ios
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/Mindebog.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export
          ls -la build/export

      - name: Upload til TestFlight (altool via API-nøgle)
        working-directory: ios
        run: |
          # altool kan afslutte med kode 0 selv om upload fejlede (set i kørsel #9),
          # så vi tjekker outputtet eksplicit.
          set -o pipefail
          xcrun altool --upload-app \
            --type ios \
            --file "build/export/Mindebog.ipa" \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee altool.log
          if grep -q "UPLOAD FAILED\|ERROR:" altool.log; then
            echo "::error::altool rapporterede fejl — se loggen ovenfor"
            exit 1
          fi
          grep -q "UPLOAD SUCCEEDED\|No errors uploading" altool.log || { echo "::error::Ingen succes-bekræftelse fra altool"; exit 1; }

      - name: Ryd op
        if: always()
        run: |
          rm -f "$KEY_PATH"
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
