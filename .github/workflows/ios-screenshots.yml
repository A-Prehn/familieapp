name: Skærmbilleder (demo-familie)

# Tager App Store-skærmbilleder af demo-familien på to simulatorer (6,9" og 6,3"),
# og laver web-versioner, delingsbillede og App Store-header af dem (issue #20).
# Kun manuelt — tager 15–20 minutter på en Mac-runner. Resultatet ligger som zip under Artifacts.
on:
  workflow_dispatch:

jobs:
  screenshots:
    name: Skærmbilleder
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Vælg nyeste Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Bruger $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Installér værktøjer
        # coreutils giver gtimeout, så en simulator eller test, der hænger, ikke låser hele jobbet.
        run: brew install xcodegen imagemagick webp coreutils

      - name: Generér Xcode-projekt
        working-directory: ios
        run: xcodegen generate

      - name: Byg app og UI-test til simulator (én gang, genbruges på begge størrelser)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Mindebog.xcodeproj \
            -scheme Mindebog \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO > build.log 2>&1 || {
              echo "::error::Build fejlede — fejlene:"; grep -n "error:" build.log | head -40; tail -30 build.log; exit 1; }
          grep -c "warning:" build.log | sed 's/^/Advarsler: /' || true

      - name: Tag skærmbilleder på 6,9" og 6,3"
        working-directory: ios
        env:
          DEMO_PHOTOS_DIR: ${{ github.workspace }}/ios/Demo/photos
        run: |
          set -o pipefail
          pick() {   # første tilgængelige simulator blandt navnene; udskriver UDID
            for name in "$@"; do
              udid=$(xcrun simctl list devices available -j | jq -r --arg n "$name" \
                '.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name == $n) | .udid' | head -1)
              if [ -n "$udid" ]; then echo "$udid"; return; fi
            done
            echo "::error::Ingen af simulatorerne findes: $*"; xcrun simctl list devices available | grep iPhone; exit 1
          }
          run_size() {   # $1 = mappenavn, resten = simulatornavne i prioriteret rækkefølge
            size=$1; shift
            udid=$(pick "$@")
            echo "== $size: $(xcrun simctl list devices | grep "$udid")"
            # Opstart med loft: bootstatus kan hænge på GitHubs runnere (kørsel 2 hang 57 min her).
            booted=no
            for attempt in 1 2; do
              echo "Starter simulator (forsøg $attempt)…"
              xcrun simctl shutdown "$udid" 2>/dev/null || true
              xcrun simctl boot "$udid" 2>&1 || true
              if gtimeout 300 xcrun simctl bootstatus "$udid" -b; then booted=yes; break; fi
              echo "::warning::Simulatoren kom ikke op inden for 5 minutter (forsøg $attempt)"
              [ "$attempt" = 1 ] && xcrun simctl erase "$udid" || true
            done
            if [ "$booted" != yes ]; then echo "::error::$size: simulatoren startede ikke"; return 1; fi
            echo "Simulator klar"
            # Pæn statuslinje som i App Store: 9:41, fuldt batteri og signal.
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState discharging --batteryLevel 100 \
              --wifiBars 3 --cellularBars 4 --operatorName ""
            out="$GITHUB_WORKSPACE/out/screenshots/$size"
            mkdir -p "$out"
            # Højst 15 minutter pr. størrelse; output vises løbende (filtreret) og gemmes i sin helhed.
            TEST_RUNNER_SCREENSHOT_DIR="$out" TEST_RUNNER_DEMO_PHOTOS_DIR="$DEMO_PHOTOS_DIR" \
            gtimeout 900 xcodebuild test-without-building \
              -project Mindebog.xcodeproj \
              -scheme Mindebog \
              -destination "platform=iOS Simulator,id=$udid" \
              -derivedDataPath build/dd \
              -only-testing:MindebogUITests/ScreenshotTests \
              -resultBundlePath "$GITHUB_WORKSPACE/out/$size.xcresult" 2>&1 \
              | tee "$GITHUB_WORKSPACE/out/test-$size.log" \
              | grep --line-buffered -E "Test Case|error|failed|XCTAssert|Testing started|\*\* TEST" \
              || echo "::warning::Testen for $size fejlede eller blev stoppet — se billederne og loggen"
            ls -la "$out"
            xcrun simctl shutdown "$udid" || true
          }
          mkdir -p "$GITHUB_WORKSPACE/out"
          run_size 6.9 "iPhone 17 Pro Max" "iPhone 16 Pro Max" || echo "::warning::6,9\" mislykkedes"
          run_size 6.3 "iPhone 17 Pro" "iPhone 16 Pro" || echo "::warning::6,3\" mislykkedes"
          # Video af verdenskortet (til opslag): optag skærmen, mens MapTourTests kører.
          udid=$(pick "iPhone 17 Pro" "iPhone 16 Pro")
          xcrun simctl boot "$udid" 2>/dev/null || true
          gtimeout 300 xcrun simctl bootstatus "$udid" -b || true
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState discharging --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 --operatorName ""
          mkdir -p "$GITHUB_WORKSPACE/out/video"
          xcrun simctl io "$udid" recordVideo --codec=h264 --force "$GITHUB_WORKSPACE/out/video/verdenskort.mp4" &
          rec=$!
          sleep 3
          TEST_RUNNER_DEMO_PHOTOS_DIR="$DEMO_PHOTOS_DIR" gtimeout 600 xcodebuild test-without-building \
            -project Mindebog.xcodeproj -scheme Mindebog \
            -destination "platform=iOS Simulator,id=$udid" -derivedDataPath build/dd \
            -only-testing:MindebogUITests/MapTourTests 2>&1 | grep -E "Test Case|error|\*\* TEST" \
            || echo "::warning::Kortvideoen mislykkedes"
          kill -INT $rec; wait $rec || true
          ls -la "$GITHUB_WORKSPACE/out/video" || true
          xcrun simctl shutdown "$udid" || true
          ls "$GITHUB_WORKSPACE"/out/screenshots/*/*.png >/dev/null 2>&1 || { echo "::error::Ingen skærmbilleder blev taget"; exit 1; }

      - name: Web-versioner, delingsbillede og App Store-header
        run: bash ios/Demo/compose.sh "$GITHUB_WORKSPACE/out"

      - name: Gem resultatet
        uses: actions/upload-artifact@v4
        with:
          name: skaermbilleder-${{ github.run_number }}
          path: |
            out/screenshots
            out/web
            out/og-image.jpg
            out/header.png
            out/video
          if-no-files-found: error

      - name: Gem testrapporter og logfiler
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testrapporter-${{ github.run_number }}
          path: |
            out/*.xcresult
            out/test-*.log
            out/screenshots
            ios/build.log
          if-no-files-found: ignore
