name: iOS build

# Kun manuel: macOS-minutter koster 10× på GitHub Free, så vi bygger
# bevidst — ikke ved hvert push.
on:
  workflow_dispatch:

jobs:
  build:
    name: Byg (simulator, uden signering)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Vælg nyeste Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Bruger $latest"
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Installér XcodeGen
        run: brew install xcodegen

      - name: Generér Xcode-projekt
        working-directory: ios
        run: xcodegen generate

      - name: Byg app til simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mindebog.xcodeproj \
            -scheme Mindebog \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
