# XcodeGen-konfiguration — genererer Mindebog.xcodeproj fra tekst.
# Kør: xcodegen generate  (i ios/-mappen). Kræver ingen Mac at redigere.
name: Mindebog
options:
  bundleIdPrefix: net.prehn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: da
    DEVELOPMENT_TEAM: 9VMB4XZSKS
    # Simulator-build (ios-build.yml) slår signering fra på kommandolinjen.
    # TestFlight-build (ios-testflight.yml) slår automatisk signering til.
    CODE_SIGN_STYLE: Automatic

targets:
  Mindebog:
    type: application
    platform: iOS
    sources:
      - path: Mindebog
      - path: Shared
    dependencies:
      # Udvidelserne indlejres automatisk i appen (PlugIns/).
      - target: VoresFamilieWidget
      - target: VoresFamilieNotifications
      - target: VoresFamilieShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehn.mindebog
        # Appens filnavn (vises bl.a. i nedbrudsrapporter). Modulnavnet bliver Mindebog, så koden er uændret.
        PRODUCT_NAME: "Vores familie"
        PRODUCT_MODULE_NAME: Mindebog
        # TestFlight-workflowet sætter APP_PROFILE (navnet på App Store-profilen).
        PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROFILE)"
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Vores familie"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        # Kun iPhone (portræt). iPad er slået fra, så App Store ikke kræver iPad-skærmbilleder.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        # Ingen egen kryptering (kun Apples/HTTPS) → TestFlight spørger ikke om export compliance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # Kræves for "Gem i Fotos" (kun tilføje — appen kan ikke læse brugerens billeder).
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Så du kan gemme billeder fra jeres mindebog i Fotos."
        # Kræves for lydnoter på højdepunkter.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Så du kan optage lydnoter, fx barnets første ord."
        # "Forslag fra Fotos": de nyeste billeder i dit bibliotek, så du slipper for at lede.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Så appen kan foreslå dine nyeste billeder, når du lægger noget i mindebogen."
        # Scanning af børnetegninger.
        INFOPLIST_KEY_NSCameraUsageDescription: "Så du kan scanne børnetegninger direkte ind i mindebogen."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iCloud/CloudKit-entitlements. Ignoreres i usigneret simulator-build (CI),
        # anvendes når appen signeres med Apple Developer-kontoen.
        CODE_SIGN_ENTITLEMENTS: Mindebog/Mindebog.entitlements

  # UI-test, der tager App Store-skærmbilleder af demo-familien (ios-screenshots.yml). Kun simulator.
  MindebogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MindebogUITests
    dependencies:
      - target: Mindebog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehn.mindebog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        TEST_TARGET_NAME: Mindebog

  # Widgets til hjemmeskærmen (fødselsdage, termin, på denne dag, dagens citat).
  VoresFamilieWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Mindebog/Models/DailyQuotes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehn.mindebog.widget
        PRODUCT_NAME: VoresFamilieWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(WIDGET_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # Omskriver CloudKit-notifikationer til "Sheila har tilføjet …".
  VoresFamilieNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehn.mindebog.notifications
        PRODUCT_NAME: VoresFamilieNotifications
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(NSE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: CloudKit.framework

  # "Del → Vores familie" fra Fotos: billeder lægges i App Group-indbakken (ShareInbox),
  # og appen gemmer dem som højdepunkter, næste gang den åbnes.
  VoresFamilieShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehn.mindebog.share
        PRODUCT_NAME: VoresFamilieShare
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "$(SHARE_PROFILE)"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    dependencies:
      - sdk: UniformTypeIdentifiers.framework
      - sdk: SwiftUI.framework

# Skemaet "Mindebog" defineres eksplicit, så UI-testen er med under Test, og Archive bruger Release
# (som TestFlight-workflowet forventer).
schemes:
  Mindebog:
    build:
      targets:
        Mindebog: all
        MindebogUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MindebogUITests
    archive:
      config: Release
