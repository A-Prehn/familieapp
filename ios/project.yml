# XcodeGen-konfiguration — genererer Mindebog.xcodeproj fra tekst.
# Kør: xcodegen generate  (i ios/-mappen). Kræver ingen Mac at redigere.
name: Mindebog
options:
  bundleIdPrefix: net.prehn
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: da
    DEVELOPMENT_TEAM: 9VMB4XZSKS
    # Simulator-build (ios-build.yml) slår signering fra på kommandolinjen.
    # TestFlight-build (ios-testflight.yml) slår automatisk signering til.
    CODE_SIGN_STYLE: Automatic

targets:
  Mindebog:
    type: application
    platform: iOS
    sources:
      - path: Mindebog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.prehn.mindebog
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_CFBundleDisplayName: Mindebog
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        # Ingen egen kryptering (kun Apples/HTTPS) → TestFlight spørger ikke om export compliance
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        # iCloud/CloudKit-entitlements. Ignoreres i usigneret simulator-build (CI),
        # anvendes når appen signeres med Apple Developer-kontoen.
        CODE_SIGN_ENTITLEMENTS: Mindebog/Mindebog.entitlements
