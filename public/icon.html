<!doctype html>
<html lang="da">
<head>
  <meta charset="UTF-8" />
  <title>Vores familie app-ikon</title>
  <style>
    body { margin:0; background:#1c1c1e; display:flex; flex-direction:column; gap:28px; align-items:center; justify-content:center; min-height:100vh; font:14px Inter, -apple-system, sans-serif; color:#ddd; }
    .row { display:flex; gap:40px; }
    .wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .label { font-size:15px; font-weight:600; color:#fff; }
    .sub { font-size:12px; color:#999; }
    svg { display:block; }
    .round { border-radius: 22.5%; overflow:hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .masters { display:none; }
  </style>
</head>
<body>
  <div class="row" id="previews"></div>
  <div class="sub">Som på hjemmeskærmen (180 px). iOS lægger selv de runde hjørner på.</div>

  <!-- Master-ikoner, 1024×1024, ingen gennemsigtighed (Apple-krav).
       Hjertet er appens kendemærke (fra familie.prehn.net), men tegnet om i fuld opløsning
       med afbalancerede buer, bløde farveovergange og lidt dybde. -->
  <div class="masters">

    <!-- A: Varmt hjerte på creme -->
    <svg id="icon-a" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
      <defs>
        <linearGradient id="a-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fcf8f3"/><stop offset="1" stop-color="#f0e5da"/>
        </linearGradient>
        <linearGradient id="a-heart" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
          <stop offset="0" stop-color="#e07d93"/><stop offset="0.55" stop-color="#d4547a"/><stop offset="1" stop-color="#c4896b"/>
        </linearGradient>
        <radialGradient id="a-shine" cx="0.35" cy="0.28" r="0.5">
          <stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
        <filter id="a-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#8a4a3a" flood-opacity="0.28"/>
        </filter>
      </defs>
      <rect width="1024" height="1024" fill="url(#a-bg)"/>
      <g filter="url(#a-shadow)">
        <path id="heart-a" d="M512 868C512 868 150 648 150 398C150 290 236 206 344 206C416 206 474 246 512 302C550 246 608 206 680 206C788 206 874 290 874 398C874 648 512 868 512 868Z" fill="url(#a-heart)"/>
      </g>
      <path d="M512 868C512 868 150 648 150 398C150 290 236 206 344 206C416 206 474 246 512 302C550 246 608 206 680 206C788 206 874 290 874 398C874 648 512 868 512 868Z" fill="url(#a-shine)"/>
    </svg>

    <!-- B: Hjerte i hjerte (familie) på creme -->
    <svg id="icon-b" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
      <defs>
        <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fcf8f3"/><stop offset="1" stop-color="#f0e5da"/>
        </linearGradient>
        <linearGradient id="b-heart" x1="0.1" y1="0.05" x2="0.9" y2="1">
          <stop offset="0" stop-color="#d49a7d"/><stop offset="1" stop-color="#b8735a"/>
        </linearGradient>
        <linearGradient id="b-small" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#e58aa0"/><stop offset="1" stop-color="#d4547a"/>
        </linearGradient>
        <filter id="b-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#8a4a3a" flood-opacity="0.26"/>
        </filter>
      </defs>
      <rect width="1024" height="1024" fill="url(#b-bg)"/>
      <g filter="url(#b-shadow)">
        <path d="M512 868C512 868 150 648 150 398C150 290 236 206 344 206C416 206 474 246 512 302C550 246 608 206 680 206C788 206 874 290 874 398C874 648 512 868 512 868Z" fill="url(#b-heart)"/>
      </g>
      <!-- Lille hjerte (barnet) i rosa med creme kant, lidt nede til højre -->
      <path d="M512 868C512 868 150 648 150 398C150 290 236 206 344 206C416 206 474 246 512 302C550 246 608 206 680 206C788 206 874 290 874 398C874 648 512 868 512 868Z"
            fill="url(#b-small)" stroke="#fcf8f3" stroke-width="70" stroke-linejoin="round"
            transform="translate(575 500) scale(0.40) translate(-512 -540)"/>
    </svg>

    <!-- C: Creme hjerte på varm terracotta (mere kontrast på hjemmeskærmen) -->
    <svg id="icon-c" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
      <defs>
        <linearGradient id="c-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#d49a7d"/><stop offset="1" stop-color="#a9654c"/>
        </linearGradient>
        <linearGradient id="c-heart" x1="0.2" y1="0" x2="0.8" y2="1">
          <stop offset="0" stop-color="#fffaf4"/><stop offset="1" stop-color="#f3e6d8"/>
        </linearGradient>
        <filter id="c-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#5a2e20" flood-opacity="0.35"/>
        </filter>
      </defs>
      <rect width="1024" height="1024" fill="url(#c-bg)"/>
      <!-- Blødt lys øverst til venstre -->
      <circle cx="300" cy="240" r="420" fill="#fff" opacity="0.08"/>
      <!-- Hjertet skaleret 1,12× om midten, så det fylder mere (som i A) -->
      <g transform="translate(512 537) scale(1.12) translate(-512 -537)">
        <g filter="url(#c-shadow)">
          <path d="M512 868C512 868 150 648 150 398C150 290 236 206 344 206C416 206 474 246 512 302C550 246 608 206 680 206C788 206 874 290 874 398C874 648 512 868 512 868Z" fill="url(#c-heart)"/>
        </g>
        <!-- Lille rosa hjerte inde i det store -->
        <path d="M512 868C512 868 150 648 150 398C150 290 236 206 344 206C416 206 474 246 512 302C550 246 608 206 680 206C788 206 874 290 874 398C874 648 512 868 512 868Z" fill="#d4547a" opacity="0.9" transform="translate(512 520) scale(0.38) translate(-512 -540)"/>
      </g>
    </svg>

  </div>

  <script>
    const variants = [
      { id: 'icon-a', label: 'A · Varmt hjerte', sub: 'rosa→terracotta, lys creme' },
      { id: 'icon-b', label: 'B · Hjerte i hjerte', sub: 'familie: stort + lille' },
      { id: 'icon-c', label: 'C · Creme på terracotta', sub: 'større hjerte (valgt)' },
    ];
    const row = document.getElementById('previews');
    for (const v of variants) {
      const wrap = document.createElement('div'); wrap.className = 'wrap';
      const round = document.createElement('div'); round.className = 'round';
      const clone = document.getElementById(v.id).cloneNode(true);
      clone.removeAttribute('id'); clone.setAttribute('width', 180); clone.setAttribute('height', 180);
      round.appendChild(clone);
      const label = document.createElement('div'); label.className = 'label'; label.textContent = v.label;
      const sub = document.createElement('div'); sub.className = 'sub'; sub.textContent = v.sub;
      wrap.append(round, label, sub);
      row.appendChild(wrap);
    }

    // Eksport til 1024×1024 PNG uden alpha (canvas tegnes på fast baggrund).
    window.exportIcon = (id = 'icon-a') => new Promise((resolve, reject) => {
      const src = document.getElementById(id);
      const xml = new XMLSerializer().serializeToString(src);
      const url = URL.createObjectURL(new Blob([xml], { type: 'image/svg+xml' }));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement('canvas');
        c.width = 1024; c.height = 1024;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#f5ede8'; ctx.fillRect(0, 0, 1024, 1024);
        ctx.drawImage(img, 0, 0, 1024, 1024);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/png'));
      };
      img.onerror = reject;
      img.src = url;
    });
  </script>
</body>
</html>
